<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D.O.A Verification System</title>
  <style>
    :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.8); --accent: #38bdf8; }
    body { background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
    .container { width: 100%; max-width: 400px; }
    .container-wide { width: 100%; max-width: 900px; }
    
    .logo-img { width: 100%; max-width: 250px; height: auto; display: block; margin: 0 auto 20px auto; }
    
    input, select { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; font-size: 15px; margin-bottom: 12px; }
    input { text-align: center; }
    .card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 100%; box-sizing: border-box; }
    
    .foto-member { width: 200px; height: 200px; border-radius: 12px; object-fit: cover; border: 4px solid var(--accent); display: block; margin: 0 auto 20px auto; }
    .badge { padding: 6px 20px; border-radius: 50px; font-weight: bold; color: white; display: inline-block; margin-bottom: 15px; font-size: 12px; }
    .btn-main { padding: 12px; width: 100%; cursor: pointer; background: var(--accent); border: none; border-radius: 12px; font-weight: 600; color: #0f172a; margin-top: 10px; }
    
    .info-grid { display: grid; grid-template-columns: 100px 1fr; gap: 8px; text-align: left; font-size: 13px; margin-top: 10px; }
    .label { font-weight: bold; color: #94a3b8; }
    
    .password-container { position: relative; width: 100%; max-width: 300px; margin: 0 auto; }
    .toggle-pass { position: absolute; right: 15px; top: 40%; transform: translateY(-50%); cursor: pointer; color: #38bdf8; font-size: 12px; font-weight: bold; }
    #errorMsg { color: #ef4444; margin-bottom: 15px; font-weight: bold; display: none; text-align: center; }
    .role-info { font-size: 12px; color: #38bdf8; margin-bottom: 15px; font-weight: bold; }
    #loadingMsg { color: #38bdf8; margin-bottom: 15px; font-weight: bold; text-align: center; }

    /* Styling Tabel & Tombol Admin */
    .table-container { width: 100%; overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; font-size: 13px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #1e293b; color: var(--accent); font-weight: bold; }
    tr:hover { background: rgba(56, 189, 248, 0.05); }
    .admin-actions { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <!-- 1. HALAMAN LOGIN -->
  <div id="loginPage" style="display:flex; flex-direction:column; align-items:center; width:100%; padding-top:30px;">
    <img src="https://drive.google.com/thumbnail?id=1cw8B7STFAm_2dkC11fe2HEt7juoRodR2&sz=w800" class="logo-img">
    <h2 style="margin-bottom:10px;">LOGIN D.O.A</h2>
    <div id="loadingMsg">Memuat data dari Spreadsheet...</div>
    <div id="errorMsg"></div>
    
    <div style="width: 100%; max-width: 300px;">
        <input id="userInput" type="text" placeholder="Masukkan Username..." autocomplete="off">
    </div>

    <div class="password-container">
        <input id="passInput" type="password" placeholder="Masukkan Password...">
        <span class="toggle-pass" onclick="togglePassword()">LIHAT</span>
    </div>
    
    <button onclick="cekLogin()" class="btn-main" style="max-width:300px;">MASUK</button>
  </div>

  <!-- 2. HALAMAN UTAMA ADMIN (TABEL & PENCARIAN) -->
  <div class="container-wide" id="mainContent" style="display:none; text-align:center;">
    <img src="https://drive.google.com/thumbnail?id=1cw8B7STFAm_2dkC11fe2HEt7juoRodR2&sz=w800" class="logo-img" style="max-width: 200px;">
    <div id="roleBadge" class="role-info"></div>
    
    <div class="admin-actions">
      <input id="noId" type="text" placeholder="Cari No ID / Nama Member..." autocomplete="off" style="flex: 1; margin-bottom:0;">
      <button onclick="bukaFormTambah()" style="padding: 0 15px; background:#22c55e; color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer; height:45px;">+ Tambah Member</button>
      <button onclick="logoutAdmin()" style="padding: 0 15px; background:#ef4444; color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer; height:45px;">Keluar</button>
    </div>

    <h3 style="text-align:left; color:#38bdf8; margin-top:20px;">Daftar Seluruh Member</h3>
    <div class="table-container">
      <table id="memberTable">
        <thead>
          <tr>
            <th>No ID</th>
            <th>No Induk</th>
            <th>Nama</th>
            <th>Club</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 3. HALAMAN FORM TAMBAH MEMBER BARU (KHUSUS ADMIN) -->
  <div class="container" id="formTambahPage" style="display:none;">
    <div class="card">
      <h3 style="color:var(--accent); text-align:center; margin-top:0;">Tambah Member Baru</h3>
      <input id="addNoId" type="text" placeholder="No ID (contoh: DOA-303)">
      <input id="addNoAnggota" type="text" placeholder="No Induk / Anggota">
      <input id="addNama" type="text" placeholder="Nama Lengkap">
      <input id="addAlamat" type="text" placeholder="Alamat">
      <input id="addNik" type="text" placeholder="NIK">
      <input id="addTglGabung" type="text" placeholder="Tanggal Bergabung (DD-MM-YYYY)">
      <input id="addExpired" type="text" placeholder="Tanggal Expired (DD-MM-YYYY)">
      <input id="addClub" type="text" placeholder="Club">
      <input id="addKontakPribadi" type="text" placeholder="Kontak Pribadi">
      <input id="addKontakDarurat" type="text" placeholder="Kontak Darurat">
      <select id="addStatus">
        <option value="AKTIF">AKTIF</option>
        <option value="EXPIRED">EXPIRED</option>
      </select>
      <input id="addFoto" type="text" placeholder="URL Foto (Opsional)">
      
      <button onclick="simpanMemberBaru()" class="btn-main" id="btnSimpan" style="background:#22c55e; color:white;">SIMPAN KE SPREADSHEET</button>
      <button onclick="tutupFormTambah()" class="btn-main" style="background:#64748b; color:white;">BATAL</button>
    </div>
  </div>
  
  <!-- 4. HALAMAN DETAIL HASIL PENCARIAN -->
  <div id="hasil" class="container"></div>

  <script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkJdjGp4F3zUkszFzjq2IHRIAXcIZdtSG-K9WCrvgGQGpVxcEnIRSJkVKSgAcN9-qw/exec";
    let databaseMember = [];

    const AKUN_PENGGUNA = {
      "admin": { pass: "DOA@2026", role: "ADMIN" },
      "budi": { pass: "12345", role: "USER", noIdTarget: "DOA-301" },
      "siti": { pass: "abcde", role: "USER", noIdTarget: "DOA-302" }
    };

    let currentUser = null;

    async function muatDataMember() {
      try {
        let response = await fetch(SCRIPT_URL);
        databaseMember = await response.json();
        document.getElementById("loadingMsg").style.display = "none";
      } catch (error) {
        console.error("Gagal memuat data:", error);
        document.getElementById("loadingMsg").innerHTML = "❌ Gagal memuat data dari Spreadsheet!";
      }
    }

    muatDataMember();

    function togglePassword() {
      var x = document.getElementById("passInput");
      var y = document.querySelector(".toggle-pass");
      if (x.type === "password") { x.type = "text"; y.innerHTML = "SEMBUNYI"; }
      else { x.type = "password"; y.innerHTML = "LIHAT"; }
    }

    function cekLogin() {
      var usernameInput = document.getElementById("userInput").value.trim().toLowerCase();
      var passwordInput = document.getElementById("passInput").value.trim();
      var errorDiv = document.getElementById("errorMsg");
      
      if (AKUN_PENGGUNA.hasOwnProperty(usernameInput) && AKUN_PENGGUNA[usernameInput].pass === passwordInput) {
        currentUser = AKUN_PENGGUNA[usernameInput];
        document.getElementById('loginPage').style.display = 'none';
        errorDiv.style.display = 'none';
        
        if (currentUser.role === "ADMIN") {
          document.getElementById('mainContent').style.display = 'block';
          document.getElementById("roleBadge").innerHTML = `Hak Akses: [ ADMIN ]`;
          tampilkanTabelAdmin(databaseMember);
        } else {
          let memberData = databaseMember.find(m => String(m.noId).trim().toUpperCase() === String(currentUser.noIdTarget).trim().toUpperCase());
          tampilkanHasil(memberData);
        }
      } else {
        errorDiv.style.display = 'block';
        errorDiv.innerHTML = "❌ Username atau Password Salah!";
        document.getElementById("passInput").style.borderColor = "#ef4444";
        document.getElementById("userInput").style.borderColor = "#ef4444";
      }
    }

    document.getElementById("passInput").addEventListener("keypress", function(e) { if (e.key === "Enter") cekLogin(); });
    document.getElementById("userInput").addEventListener("keypress", function(e) { if (e.key === "Enter") document.getElementById("passInput").focus(); });

    // Live search admin
    document.getElementById("noId").addEventListener("input", function() {
      let keyword = this.value.trim().toLowerCase();
      let filtered = databaseMember.filter(m => 
        String(m.noId).toLowerCase().includes(keyword) || 
        String(m.nama).toLowerCase().includes(keyword)
      );
      tampilkanTabelAdmin(filtered);
    });

    function tampilkanTabelAdmin(dataList) {
      let tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (dataList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">Data tidak ditemukan</td></tr>`;
        return;
      }

      dataList.forEach(m => {
        let statusRaw = String(m.status || "").toUpperCase();
        let isAktiv = statusRaw.includes("AKTiv") || statusRaw.includes("AKTIF");
        let badgeColor = isAktiv ? "#22c55e" : "#ef4444";
        let badgeText = isAktiv ? "AKTIF" : "EXPIRED";

        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.noId || ''}</td>
          <td>${m.noAnggota || ''}</td>
          <td>${m.nama || ''}</td>
          <td>${m.club || ''}</td>
          <td><span style="color:${badgeColor}; font-weight:bold;">${badgeText}</span></td>
          <td><button onclick="lihatDetail('${m.noId}')" style="padding:6px 12px; background:var(--accent); border:none; border-radius:6px; font-weight:bold; cursor:pointer; color:#0f172a;">Detail</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function lihatDetail(idTarget) {
      document.getElementById('mainContent').style.display = 'none';
      let member = databaseMember.find(m => String(m.noId).trim().toLowerCase() === String(idTarget).trim().toLowerCase());
      tampilkanHasil(member);
    }

    function bukaFormTambah() {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('formTambahPage').style.display = 'block';
    }

    function tutupFormTambah() {
      document.getElementById('formTambahPage').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      tampilkanTabelAdmin(databaseMember);
    }

    // Mengirim data baru langsung ke Spreadsheet via POST
    async function simpanMemberBaru() {
      let btn = document.getElementById("btnSimpan");
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      let newData = {
        noId: document.getElementById("addNoId").value.trim(),
        noAnggota: document.getElementById("addNoAnggota").value.trim(),
        nama: document.getElementById("addNama").value.trim(),
        alamat: document.getElementById("addAlamat").value.trim(),
        nik: document.getElementById("addNik").value.trim(),
        tglGabung: document.getElementById("addTglGabung").value.trim(),
        expired: document.getElementById("addExpired").value.trim(),
        club: document.getElementById("addClub").value.trim(),
        kontakPribadi: document.getElementById("addKontakPribadi").value.trim(),
        kontakDarurat: document.getElementById("addKontakDarurat").value.trim(),
        status: document.getElementById("addStatus").value,
        foto: document.getElementById("addFoto").value.trim() || "https://placehold.co/200x200?text=No+Photo"
      };

      if (!newData.noId || !newData.nama) {
        alert("No ID dan Nama wajib diisi!");
        btn.innerText = "SIMPAN KE SPREADSHEET";
        btn.disabled = false;
        return;
      }

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(newData)
        });

        alert("✅ Data berhasil disimpan ke Spreadsheet!");
        
        // Reset form
        document.querySelectorAll('#formTambahPage input').forEach(input => input.value = "");
        
        // Muat ulang data terbaru dari spreadsheet
        await muatDataMember();
        tutupFormTambah();
      } catch (error) {
        console.error("Gagal menyimpan:", error);
        alert("❌ Terjadi kesalahan saat menyimpan data.");
      } finally {
        btn.innerText = "SIMPAN KE SPREADSHEET";
        btn.disabled = false;
      }
    }

    function tampilkanHasil(member) {
      document.getElementById("hasil").innerHTML = ""; 
      if (!member) {
        document.getElementById("hasil").innerHTML = "<div class='card' style='text-align:center;'>❌ DATA MEMBER TIDAK DITEMUKAN!<br><button onclick='resetTampilan()' class='btn-main'>KEMBALI</button></div>";
        return;
      }
      let statusRaw = String(member.status).toUpperCase();
      let isAktiv = statusRaw.includes("AKTIV") || statusRaw.includes("AKTIF");
      let color = isAktiv ? "#22c55e" : "#ef4444";
      let text = isAktiv ? "AKTIF" : "EXPIRED";

      let detailInfo = "";
      if (currentUser && currentUser.role === "ADMIN") {
        detailInfo = `
          <div class="label">NO ID</div><div>: ${member.noId || ''}</div>
          <div class="label">NO INDUK</div><div>: ${member.noAnggota || ''}</div>
          <div class="label">NAMA</div><div>: ${member.nama || ''}</div>
          <div class="label">ALAMAT</div><div>: ${member.alamat || ''}</div>
          <div class="label">NIK</div><div>: ${member.nik || ''}</div>
          <div class="label">BERGABUNG</div><div>: ${member.tglGabung || ''}</div>
          <div class="label">EXPIRED</div><div>: ${member.expired || ''}</div>
          <div class="label">CLUB</div><div>: ${member.club || ''}</div>
          <div class="label">KONTAK</div><div>: ${member.kontakPribadi || ''}</div>
          <div class="label">K. DARURAT</div><div>: ${member.kontakDarurat || ''}</div>
        `;
      } else {
        detailInfo = `
          <div class="label">NO ID</div><div>: ${member.noId || ''}</div>
          <div class="label">NAMA</div><div>: ${member.nama || ''}</div>
          <div class="label">CLUB</div><div>: ${member.club || ''}</div>
          <div class="label">EXPIRED</div><div>: ${member.expired || ''}</div>
        `;
      }

      document.getElementById("hasil").innerHTML = `
        <div class='card' style="text-align:center;">
          <img src="${member.foto || ''}" class="foto-member" onerror="this.src='https://placehold.co/200x200?text=No+Photo'">
          <h3>${member.nama || ''}</h3>
          <div class="badge" style="background:${color}">${text}</div>
          <div class="info-grid">
            ${detailInfo}
          </div>
          <button onclick='resetTampilan()' class='btn-main'>${currentUser && currentUser.role === 'ADMIN' ? 'KEMBALI KE TABEL' : 'KELUAR / GANTI AKUN'}</button>
        </div>`;
    }

    function resetTampilan() {
      document.getElementById("hasil").innerHTML = "";
      if (currentUser && currentUser.role === "ADMIN") {
        document.getElementById('mainContent').style.display = 'block';
        tampilkanTabelAdmin(databaseMember);
      } else {
        logoutAdmin();
      }
    }

    function logoutAdmin() {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('formTambahPage').style.display = 'none';
      document.getElementById('hasil').innerHTML = '';
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('userInput').value = "";
      document.getElementById('passInput').value = "";
      document.getElementById('userInput').focus();
      currentUser = null;
    }
  </script>
</body>
</html>
