<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D.O.A Airsoft - Verifikasi Member</title>
  <style>
    :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.9); --accent: #38bdf8; --red: #ef4444; }
    body { background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
    .container { width: 100%; max-width: 400px; }
    .container-wide { width: 100%; max-width: 1000px; }
    
    input, select { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; font-size: 15px; margin-bottom: 12px; }
    input { text-align: center; }
    .card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; box-sizing: border-box; }
    
    .btn-main { padding: 12px; width: 100%; cursor: pointer; background: var(--accent); border: none; border-radius: 12px; font-weight: 600; color: #0f172a; margin-top: 5px; font-size: 15px; }
    
    .password-container { position: relative; width: 100%; }
    .toggle-pass { position: absolute; right: 15px; top: 40%; transform: translateY(-50%); cursor: pointer; color: #38bdf8; font-size: 12px; font-weight: bold; }
    #errorMsg { color: var(--red); margin-bottom: 15px; font-weight: bold; display: none; text-align: center; font-size: 14px; }
    #loadingMsg { color: #38bdf8; margin-bottom: 15px; font-weight: bold; text-align: center; font-size: 14px; }

    /* Styling Tabel & Header Admin */
    .header-title { color: var(--red); font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 20px; letter-spacing: 0.5px; }
    .table-container { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 12px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; background: #161e2e; font-size: 13px; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #222b3b; }
    th { background: #1e293b; color: #94a3b8; font-weight: bold; font-size: 12px; text-transform: uppercase; }
    tr:hover { background: rgba(56, 189, 248, 0.05); }
    
    .admin-actions { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .badge-aktif { color: #22c55e; font-weight: bold; }
    .badge-expired { color: var(--red); font-weight: bold; }
  </style>
</head>
<body>

  <!-- 1. HALAMAN LOGIN -->
  <div id="loginPage" style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; flex:1;">
    <div class="card" style="max-width: 380px;">
      <h2 style="text-align:center; margin-top:0; color:var(--accent); margin-bottom:20px;">LOGIN D.O.A</h2>
      <div id="loadingMsg">Memuat data sistem dari Spreadsheet...</div>
      <div id="errorMsg"></div>
      
      <input id="userInput" type="text" placeholder="Masukkan Username..." autocomplete="off">

      <div class="password-container">
          <input id="passInput" type="password" placeholder="Masukkan Password...">
          <span class="toggle-pass" onclick="togglePassword()">LIHAT</span>
      </div>
      
      <button onclick="cekLogin()" class="btn-main">MASUK</button>
    </div>
  </div>

  <!-- 2. HALAMAN UTAMA TABEL MEMBER SETELAH LOGIN -->
  <div class="container-wide" id="mainContent" style="display:none; padding-top: 10px;">
    <div class="header-title">D.O.A Airsoft - Verifikasi Member</div>
    <div id="roleInfo" style="text-align:center; color:#38bdf8; font-size:13px; margin-bottom:15px; font-weight:bold;"></div>
    
    <div class="admin-actions">
      <input id="noId" type="text" placeholder="Cari berdasarkan No. ID atau Nama..." autocomplete="off" style="flex: 1; margin-bottom:0; background:#161e2e;">
      <button onclick="logoutAdmin()" style="padding: 0 20px; background:var(--red); color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer; height:45px;">Keluar</button>
    </div>

    <div class="table-container">
      <table id="memberTable">
        <thead>
          <tr>
            <th>No. ID</th>
            <th>No. Induk</th>
            <th>Nama</th>
            <th>Status</th>
            <th>Kontak</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzk4xsdq7dz3uKBEnyXY94pRvNhgas5eMwhfTg1mRuyiseuONd2gLmxi1fMffgvwDHs/exec";
    let databaseMember = [];
    let daftarAkunSetting = {}; // Menyimpan data user & password dari sheet SETTING
    let currentUser = null;

    async function muatDataSistem() {
      try {
        let response = await fetch(SCRIPT_URL);
        let hasil = await response.json();
        
        // Asumsi data dari Apps Script berupa objek { member: [...], setting: [...] }
        // Atau jika skrip Anda langsung array member dan array setting terpisah:
        databaseMember = hasil.member || hasil; 
        
        // Memproses data setting login dari spreadsheet
        let rawSetting = hasil.setting || [];
        rawSetting.forEach(item => {
          if(item.username) {
            daftarAkunSetting[String(item.username).trim().toLowerCase()] = {
              pass: String(item.password).trim(),
              role: String(item.role).trim().toUpperCase(),
              noIdTarget: item.noIdTarget || ""
            };
          }
        });

        let loadMsg = document.getElementById("loadingMsg");
        if (loadMsg) loadMsg.style.display = "none";
      } catch (error) {
        console.error("Gagal memuat data:", error);
        let loadMsg = document.getElementById("loadingMsg");
        if (loadMsg) loadMsg.innerHTML = "❌ Gagal memuat data dari Spreadsheet!";
      }
    }

    muatDataSistem();

    function togglePassword() {
      var x = document.getElementById("passInput");
      var y = document.querySelector(".toggle-pass");
      if (x.type === "password") { x.type = "text"; y.innerHTML = "SEMBUNYI"; }
      else { x.type = "password"; y.innerHTML = "LIHAT"; }
    }

    function cekLogin() {
      var usernameInput = document.getElementById("userInput").value.trim().toLowerCase();
      var passwordInput = document.getElementById("passInput").value.trim();
      var errorDiv = document.getElementById("errorMsg");
      
      if (daftarAkunSetting.hasOwnProperty(usernameInput) && daftarAkunSetting[usernameInput].pass === passwordInput) {
        currentUser = daftarAkunSetting[usernameInput];
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        errorDiv.style.display = 'none';
        
        if (currentUser.role === "ADMIN") {
          document.getElementById('roleInfo').innerHTML = `Login sebagai: <b>ADMIN</b>`;
          tampilkanTabelAdmin(databaseMember);
        } else {
          document.getElementById('roleInfo').innerHTML = `Login sebagai: <b>USER (${currentUser.noIdTarget})</b>`;
          let filteredUser = databaseMember.filter(m => String(m.noId).trim().toUpperCase() === String(currentUser.noIdTarget).trim().toUpperCase());
          tampilkanTabelAdmin(filteredUser);
        }
      } else {
        errorDiv.style.display = 'block';
        errorDiv.innerHTML = "❌ Username atau Password Salah!";
        document.getElementById("passInput").style.borderColor = "var(--red)";
        document.getElementById("userInput").style.borderColor = "var(--red)";
      }
    }

    document.getElementById("passInput").addEventListener("keypress", function(e) { if (e.key === "Enter") cekLogin(); });
    document.getElementById("userInput").addEventListener("keypress", function(e) { if (e.key === "Enter") document.getElementById("passInput").focus(); });

    // Live search
    document.getElementById("noId").addEventListener("input", function() {
      let keyword = this.value.trim().toLowerCase();
      let dataSource = databaseMember;
      
      if (currentUser && currentUser.role !== "ADMIN") {
        dataSource = databaseMember.filter(m => String(m.noId).trim().toUpperCase() === String(currentUser.noIdTarget).trim().toUpperCase());
      }

      let filtered = dataSource.filter(m => 
        String(m.noId).toLowerCase().includes(keyword) || 
        String(m.nama).toLowerCase().includes(keyword)
      );
      tampilkanTabelAdmin(filtered);
    });

    function tampilkanTabelAdmin(dataList) {
      let tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (dataList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Data tidak ditemukan</td></tr>`;
        return;
      }

      dataList.forEach(m => {
        let statusRaw = String(m.status || "").toUpperCase();
        let isAktiv = statusRaw.includes("AKTIV") || statusRaw.includes("AKTIF");
        let badgeClass = isAktiv ? "badge-aktif" : "badge-expired";
        let badgeText = isAktiv ? "AKTIV" : "TIDAK AKTIV";

        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.noId || ''}</td>
          <td>${m.noAnggota || ''}</td>
          <td>${m.nama || ''}</td>
          <td><span class="${badgeClass}">${badgeText}</span></td>
          <td>${m.kontakPribadi || ''}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function logoutAdmin() {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('userInput').value = "";
      document.getElementById('passInput').value = "";
      document.getElementById('userInput').focus();
      currentUser = null;
    }
  </script>
</body>
</html>
