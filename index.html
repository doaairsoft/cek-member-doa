<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.O.A Airsoft - Member Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #ff4d4d;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #ff4d4d;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #e03b3b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #333;
        }
        .loading {
            color: #f39c12;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>D.O.A Airsoft - Verifikasi Member</h2>
        <p class="loading" id="statusMessage">Memuat data dari Spreadsheet...</p>
        
        <!-- Form Pencarian / Input Sederhana -->
        <input type="text" id="searchInput" placeholder="Cari berdasarkan No. ID atau Nama..." onkeyup="filterData()">

        <div style="overflow-x:auto;">
            <table id="memberTable">
                <thead>
                    <tr>
                        <th>No. ID</th>
                        <th>No. Induk</th>
                        <th>Nama</th>
                        <th>Status</th>
                        <th>Kontak</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan dimasukkan secara otomatis oleh JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // URL Apps Script Terbaru Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgUupPVpwuh_qIqrNEmj_shlvU8mw5fSKhsFUUYYGzG_Eej-STBiEmW8UIZRz7k982/exec";
        
        let allMembers = [];

        async function fetchMembers() {
            const statusMessage = document.getElementById("statusMessage");
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                allMembers = data;
                renderTable(allMembers);
                
                if(data.length > 0) {
                    statusMessage.style.display = "none";
                } else {
                    statusMessage.innerText = "Tidak ada data member.";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                statusMessage.innerText = "Gagal memuat data dari Spreadsheet!";
                statusMessage.style.color = "#ff4d4d";
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            
            data.forEach(member => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${member.noId || '-'}</td>
                    <td>${member.noAnggota || '-'}</td>
                    <td>${member.nama || '-'}</td>
                    <td>${member.status || '-'}</td>
                    <td>${member.kontakPribadi || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const keyword = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allMembers.filter(m => {
                const id = (m.noId || "").toLowerCase();
                const name = (m.nama || "").toLowerCase();
                return id.includes(keyword) || name.includes(keyword);
            });
            renderTable(filtered);
        }

        // Jalankan saat halaman dimuat
        window.onload = fetchMembers;
    </script>

</body>
</html>
